name: Jodeit AutoBalance Pro
version: 0.6.1
slug: autobalance_pro
description: Read-only pilot for room, thermal zone and heating-system data
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:radiator
panel_title: AutoBalance Pro
homeassistant_api: true
map:
  - type: data
    read_only: false
  - type: share          # AB-026: deletion register outside the app's own backup (/share/autobalance)
    read_only: false
options:
  messkoffer: false   # AB-026/Review 8: only the mobile measuring kit removes the customer configuration after the deadline
schema:
  messkoffer: bool
